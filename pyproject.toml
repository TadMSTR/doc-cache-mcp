[build-system]
# Pinned exactly: uv.lock does not lock build dependencies, so a range here would let
# every wheel build pick up whatever hatchling is newest that day.
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "doc-cache-mcp"
version = "0.4.0"
description = "Capability-scoped FastMCP server for the forge documentation cache (list/add/sync + source-URL allowlist)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "fastmcp", "homelab", "documentation", "cache", "forge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# uv.lock is the contract: a deploy builds a fresh venv from it with `uv sync --frozen
# --no-editable` (README, "Installation"), and CI audits the locked set. The ranges below
# are what a fresh resolve may pick, and the CI `latest` job tests the newest of them.
dependencies = [
    # Capped below 4: 4.x is a major this server has never run on. 3.4.10 is a security
    # floor.
    "fastmcp>=3.4.10,<4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "PyYAML>=6.0",
    # Required by the imported doc-sync logic (fetch + HTML->markdown).
    "requests>=2.33.0",
    "html2text>=2024.2.26",
    # SECURITY FLOORS on transitive dependencies (2026-10-30). None is imported here
    # directly; each is declared only to hold its floor, the first release with a published
    # security fix. uv.lock is the control; these are the second line, for an install that
    # re-resolves.
    #
    # Scope, checked against every published advisory for every package in the locked
    # runtime set. Every package a request reaches whose range still admitted an advisory
    # has a floor:
    # - the fetch path. doc-sync fetches every cached page through requests, urllib3, idna
    #   and certifi, including from provisional hosts nobody approved, so these four are
    #   on the request path for this server. requests is floored above.
    # - the streamable-http transport: mcp, starlette, python-multipart, anyio, h11
    #   (uvicorn's parser).
    # - pyjwt (mcp's auth layer) and cryptography.
    # - opentelemetry-api: fastmcp parses every tool call's `_meta` trace context with it,
    #   whether or not a telemetry sink is configured.
    # These ranges still admit an advisory but are held only by the lock, because no
    # request reaches the affected code: authlib, joserfc (fastmcp's auth providers; none is
    # configured), dnspython, jaraco-context, protobuf and pyarrow (telemetry exporters),
    # pydantic-settings and python-dotenv (read the environment once at startup), pygments.
    "urllib3>=2.8.0",
    "idna>=3.15",
    "certifi>=2026.10.18",
    # Capped below 2 with fastmcp's own range. The transport also runs stateless, see
    # server.main().
    "mcp>=1.30.0,<2",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "anyio>=4.14.2",
    "h11>=0.16.0",
    "pyjwt>=2.15.0",
    "cryptography>=50.0.0",
    "opentelemetry-api>=1.45.1",
]

[project.optional-dependencies]
telemetry = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "influxdb3-python>=0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "PyYAML>=6.0",
    "ruff==0.16.0",
]

[project.scripts]
doc-cache-mcp = "doc_cache_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_cache_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# A verbatim copy of host-forge-scripts' doc-sync.py (less its index step) — kept in that
# repo's style so it can be diffed against the live script, not reformatted into this one.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Explicit fleet-standard rule set (matches task-queue-mcp / vikunja-mcp).
# Pinned so ruff's expanding default select can't leak new rules in on upgrade.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
