[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-cache-mcp"
version = "0.3.1"
description = "Capability-scoped FastMCP server for the forge documentation cache (list/add/sync + source-URL allowlist)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "fastmcp", "homelab", "documentation", "cache", "forge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "PyYAML>=6.0",
    # Required by the imported doc-sync logic (fetch + HTML->markdown).
    "requests>=2.31",
    # 2.8.0 fixes two streaming-API flaws (GHSA-gh4c-6fx4-qh6g infinite loop,
    # GHSA-vxq7-64xx-v4gw unbounded chunk-size buffer) that the provisional tier's capped,
    # streamed read reaches from hosts nobody approved (audit F-01).
    "urllib3>=2.8.0",
    "html2text>=2024.2.26",
    # Floors only — venv-deploy keeps an installed dependency that still satisfies its
    # spec, so a CVE fix reaches the venv only when the floor moves (p2 audit F-06).
    # mcp 1.30.0 fixes CVE-2026-59951 (GHSA-84m7-p3x7-pcfv, unreclaimed streamable-HTTP
    # sessions); the transport now also runs stateless, see server.main().
    "mcp>=1.30.0",
    "pyjwt>=2.15.0",
    "anyio>=4.14.2",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
telemetry = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "influxdb3-python>=0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "PyYAML>=6.0",
    "ruff==0.16.0",
]

[project.scripts]
doc-cache-mcp = "doc_cache_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_cache_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# A verbatim copy of host-forge-scripts' doc-sync.py (less its index step) — kept in that
# repo's style so it can be diffed against the live script, not reformatted into this one.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Explicit fleet-standard rule set (matches task-queue-mcp / vikunja-mcp).
# Pinned so ruff's expanding default select can't leak new rules in on upgrade.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
