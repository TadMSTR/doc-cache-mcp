name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege at the top level; the one job that publishes escalates below.
permissions:
  contents: read

# Source-only release (no PyPI). A tag `vX.Y.Z` cuts a GitHub Release with auto-generated
# notes.
jobs:
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for gh release create

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job holds contents: write. Leave no token in .git/config; gh reads
          # GH_TOKEN from the environment.
          persist-credentials: false

      - name: Create GitHub Release (source only)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" &>/dev/null; then
            echo "Release ${TAG_NAME} already exists; nothing to do."
          else
            gh release create "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --generate-notes \
              --verify-tag
          fi
